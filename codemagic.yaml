workflows:
  derby-bins:
    name: Android Play (AAB)
    max_build_duration: 30
    environment:
      flutter: stable
      ubuntu: 24.04
      android_signing:
        - derby-bins-release
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
  derby-bins-apk:
    name: Android Test (APK)
    max_build_duration: 30
    environment:
      flutter: stable
      ubuntu: 24.04
      android_signing:
        - derby-bins-release
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
  derby-bins-ios:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        APP_STORE_APPLE_ID: "6817374925"
      flutter: stable
      xcode: latest
      cocoapods: default

    # Deliberately no `triggering:` block — manual runs only. A push-to-main
    # trigger would publish every merge to TestFlight.
    #
    # Signing is done by the Codemagic CLI rather than the native `ios_signing`
    # block, because `ios_signing` only FETCHES existing signing files and the
    # Developer Portal integration needed to generate them is not configured.
    # `fetch-signing-files --create` creates the certificate and the App Store
    # provisioning profile on demand through the App Store Connect API.
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "uk.co.derbybins.app" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      # MUST run before `pod install`: at this point ios/Pods/Pods.xcodeproj
      # does not exist on a clean checkout, so use-profiles' `**/*.xcodeproj`
      # glob can only match ios/Runner.xcodeproj. Running it afterwards risks
      # stamping PROVISIONING_PROFILE_SPECIFIER onto CocoaPods targets.
      - name: Apply signing settings to Xcode project
        script: |
          xcode-project use-profiles

      # MUST precede `pod install`: ios/Podfile resolves FLUTTER_ROOT from
      # ios/Flutter/Generated.xcconfig, which `pub get` generates.
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          cd ios && pod install

      # TestFlight rejects duplicate build numbers, and this workflow does not
      # reach the App Store, so query the TestFlight corpus. The command exits 0
      # with empty stdout when no builds exist yet, hence the ${LATEST:-0}
      # guard. Do NOT add `2>/dev/null || echo 0` — that would swallow genuine
      # auth and network failures.
      - name: Build ipa
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          BUILD_NUMBER=$((${LATEST:-0} + 1))
          echo "==> Building TestFlight build number ${BUILD_NUMBER}"
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/Podfile.lock

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
