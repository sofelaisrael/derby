workflows:
  derby-bins:
    name: Derby Bins
    max_build_duration: 30
    environment:
      flutter: stable
      ubuntu: 24.04
      android_signing:
        - derby-bins-release
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
