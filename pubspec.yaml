name: derby_bins
description: Derbyshire bin collection schedule app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  share_plus: ^10.1.0
  path_provider: ^2.1.2
  rxdart: ^0.27.7
  background_fetch: ^1.3.2
  url_launcher: ^6.2.2
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
